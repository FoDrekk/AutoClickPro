[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "autoclick-pro"
description = "Desktop auto-clicker for Windows built with PySide6."
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version", "dependencies"]

[tool.setuptools]
packages = ["autoclick_pro", "autoclick_pro.ui"]

[tool.setuptools.dynamic]
version = { attr = "autoclick_pro.__version__" }
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["build", "dist", "*.spec"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # En dashes and middots in UI text are intentional.

[tool.mypy]
python_version = "3.10"
files = ["autoclick_pro", "main.py"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
